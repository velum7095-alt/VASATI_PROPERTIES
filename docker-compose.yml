version: '3.8'

# ------------------------------------------------------------------------------
# BANGALORE REAL ESTATE DPDP PORTAL — DOCKER COMPOSE CONFIGURATION
# Production deployment ready for Coolify, VPS, or local Docker environments
# ------------------------------------------------------------------------------

services:
  # 1. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: bangalore_rera_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpdp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_super_secret_db_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bangalore_realestate_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dpdp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpdp_admin} -d ${POSTGRES_DB:-bangalore_realestate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bangalore_rera_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dpdp_admin}:${POSTGRES_PASSWORD:-change_me_super_secret_db_password_2026}@db:5432/${POSTGRES_DB:-bangalore_realestate_db}?schema=public"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      IP_HASH_SALT: ${IP_HASH_SALT:-dpdp_bangalore_production_salted_ip_hash}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-bangalore_admin_session_secret_change_in_prod}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@example.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-ChangeMeInProduction#2026!}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-[BUSINESS_NAME_PLACEHOLDER]}
      NEXT_PUBLIC_BUSINESS_ADDRESS: ${NEXT_PUBLIC_BUSINESS_ADDRESS:-[BUSINESS_ADDRESS_PLACEHOLDER]}
      NEXT_PUBLIC_AGENCY_KRERA_NO: ${NEXT_PUBLIC_AGENCY_KRERA_NO:-PRM/KA/RERA/1251/[YEAR]/AG/[NUMBER_PLACEHOLDER]}
      NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: ${NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME:-[GRIEVANCE_OFFICER_NAME_PLACEHOLDER]}
      NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL: ${NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL:-grievance@example.com}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-919876543210}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dpdp_network

networks:
  dpdp_network:
    driver: bridge

volumes:
  pgdata:
    driver: local

